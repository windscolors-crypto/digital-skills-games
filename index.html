<!doctype html>

<style>
:root{
  --ground:#FBF7F0; --surface:#FFFFFF; --ink:#211C17; --muted:#6B6055; --line:#E6DCCC; --ghost:#F3EEE6;
  --olive:#3F6B3A; --red:#B23A2E; --gold:#E0A526; --sea:#1B6CA8; --orange:#E8732C; --sky:#CFE6F5;
  --g7:#3F8A3A; --g8:#E8732C; --g9:#1B6CA8; --g10:#B23A2E;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14181A; --surface:#1C2326; --ink:#F0EAE0; --muted:#A99E90; --line:#2E3A3E; --ghost:#181E21;
  --g7:#7CC473; --g8:#F59A5C; --g9:#6BB3E6; --g10:#EE9385; --sky:#1E3442;
}}
:root[data-theme="dark"]{
  --ground:#14181A; --surface:#1C2326; --ink:#F0EAE0; --muted:#A99E90; --line:#2E3A3E; --ghost:#181E21;
  --g7:#7CC473; --g8:#F59A5C; --g9:#6BB3E6; --g10:#EE9385; --sky:#1E3442;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
.tatreez{height:14px;background-image:
  linear-gradient(45deg,var(--red) 25%,transparent 25%),
  linear-gradient(-45deg,var(--red) 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,var(--olive) 75%),
  linear-gradient(-45deg,transparent 75%,var(--olive) 75%);
  background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;opacity:.85}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:10px;
  background:linear-gradient(160deg,#FFF3DC 0%,#FDE3CF 55%,#E9F2E4 100%);
  border-radius:26px;padding:22px 24px;overflow:hidden;position:relative}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(160deg,#2A2418,#2B1E17 55%,#18241A)}}
.hero h1{font-family:var(--display);font-size:clamp(30px,5.6vw,48px);margin:0;line-height:1.1}
.hero h1 span{color:var(--g8)}
.hero p{color:var(--muted);margin:8px 0 0;font-size:16.5px}
.hero svg{width:100%;height:auto;max-height:230px}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:18px}.hero svg{max-height:170px;order:-1}}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 4px}
@media (max-width:640px){.tabs{grid-template-columns:repeat(2,1fr)}}
.tab{font:inherit;cursor:pointer;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);
  padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:start;transition:transform .1s}
.tab .num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-family:var(--display);font-size:24px;font-weight:800;color:#fff;background:var(--c)}
.tab b{display:block;font-family:var(--display);font-size:18px;line-height:1.2}
.tab small{color:var(--muted);font-size:13px}
.tab[aria-selected="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));transform:translateY(-2px)}
.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- units ---------- */
.unit{margin-top:28px}
.unit-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.unit-head .ic{flex:none;width:58px;height:58px;border-radius:18px;background:color-mix(in srgb,var(--c) 15%,var(--surface));display:grid;place-items:center}
.unit-head .ic svg{width:52px;height:40px}
.unit-head h2{font-family:var(--display);font-size:clamp(20px,3.4vw,26px);margin:0;line-height:1.2}
.unit-head small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);font-weight:500}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.slot{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;text-decoration:none;color:var(--muted);
  border:2px dashed var(--line);background:var(--ghost);min-height:230px}
.slot .art{height:104px;position:relative;display:grid;place-items:center;background:var(--line)}
.slot .art svg{width:100%;height:100%}
.slot .art .badge{position:absolute;inset-block-start:10px;inset-inline-start:10px;background:var(--surface);color:var(--ink);
  border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.slot .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.slot ol{list-style-type:arabic-indic;margin:0;padding-inline-start:22px;font-weight:600}
.slot ol li{margin:2px 0}
.slot .st{margin-top:auto;font-weight:700;font-size:15px}
.slot:not(.ready) .art{filter:grayscale(1);opacity:.45}
.slot.ready{border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));background:var(--surface);color:var(--ink);transition:transform .12s,box-shadow .12s}
.slot.ready .art{background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.slot.ready .st{color:var(--c);display:flex;align-items:center;gap:8px}
.slot.ready .st i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff}
.slot.ready:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px color-mix(in srgb,var(--c) 70%,transparent)}
.slot.ready:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.slot .name{font-family:var(--display);font-size:21px;line-height:1.3;color:var(--ink)}

.extras{margin-top:38px;border-top:2px solid var(--line);padding-top:18px}
.extras h2{font-family:var(--display);font-size:22px;margin:0 0 4px}
.extras p{color:var(--muted);margin:0 0 12px;font-size:15px}
.foot{margin-top:40px;color:var(--muted);font-size:14px;text-align:center}
@media (prefers-reduced-motion:reduce){.slot.ready,.tab{transition:none}.slot.ready:hover{transform:none}}
</style>
</head>

const AR="٠١٢٣٤٥٦٧٨٩", ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const ORD=["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع"];

function slotsOf(G,unit){
  const out=[];
  for(let i=0;i<unit.lessons.length;i+=2){
    const a=i+1, b=i+2<=unit.lessons.length?i+2:null;
    out.push({a,b,names:unit.lessons.slice(i,i+2),art:unit.art,g:G.g,
      path:`g${G.g}/u${unit.u}-l${a}${b?"-"+b:""}.html`});
  }
  return out;
}

const cache={};
async function exists(path){
  if(path in cache) return cache[path];
  try{ const r=await fetch(path,{method:"HEAD",cache:"no-store"}); cache[path]=r.ok; }
  catch(e){ cache[path]=false; }
  return cache[path];
}

function inner(s){
  const tag=s.b?`الدرسان ${ar(s.a)} و${ar(s.b)}`:`الدرس ${ar(s.a)}`;
  return `<div class="art">${svg(s.art)}<span class="badge">${tag}</span></div>
   <div class="body"><ol start="${s.a}">${s.names.map(n=>`<li>${n}</li>`).join("")}</ol><span class="st">قريبًا</span></div>`;
}
function card(s){
  const el=document.createElement("div");
  el.className="slot"; el.style.setProperty("--c",gColor(s.g)); el.innerHTML=inner(s);
  exists(s.path).then(ok=>{
    if(!ok) return;
    const a=document.createElement("a");
    a.className="slot ready"; a.href=s.path; a.style.setProperty("--c",gColor(s.g)); a.innerHTML=el.innerHTML;
    a.querySelector(".st").innerHTML=`<i>←</i> ابدآ اللعب`;
    el.replaceWith(a);
  });
  return el;
}

function render(gi){
  const G=GRADES[gi], panel=document.getElementById("panel");
  panel.innerHTML=""; panel.setAttribute("aria-labelledby","tab"+G.g);
  G.units.forEach(U=>{
    const sec=document.createElement("section"); sec.className="unit"; sec.style.setProperty("--c",gColor(G.g));
    sec.innerHTML=`<div class="unit-head"><span class="ic">${icon(U.art)}</span><h2>الوحدة ${ORDF[U.u]}: ${U.name}<small>${U.en}</small></h2></div>`;
    const grid=document.createElement("div"); grid.className="grid";
    slotsOf(G,U).forEach(s=>grid.appendChild(card(s)));
    sec.appendChild(grid); panel.appendChild(sec);
  });
  document.querySelectorAll(".tab").forEach((t,i)=>t.setAttribute("aria-selected",i===gi));
  try{localStorage.setItem("dsg:grade",gi)}catch(e){}
}

const tabs=document.getElementById("tabs");
GRADES.forEach((G,i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.id="tab"+G.g; b.setAttribute("role","tab"); b.style.setProperty("--c",gColor(G.g));
  b.innerHTML=`<span class="num">${ar(G.g)}</span><span><b>الصف ${G.label}</b></span>`;
  b.onclick=()=>render(i);
  tabs.appendChild(b);
});
let start=0;
try{const v=+localStorage.getItem("dsg:grade"); if(v>=0&&v<GRADES.length) start=v;}catch(e){}
const q=new URLSearchParams(location.search).get("g");
GRADES.forEach((G,i)=>{ if(q==String(G.g)) start=i; });
render(start);

(async()=>{
  const grid=document.getElementById("extraGrid"); let any=false;
  for(const x of EXTRAS){
    if(!(await exists(x.path))) continue;
    any=true;
    const a=document.createElement("a"); a.className="slot ready"; a.href=x.path; a.style.setProperty("--c",gColor(x.g));
    a.innerHTML=`<div class="art">${svg(x.art)}<span class="badge">${x.tag}</span></div><div class="body"><span class="name">${x.name}</span><span class="st"><i>←</i> ابدآ اللعب</span></div>`;
    grid.appendChild(a);
  }
  document.getElementById("extras").hidden=!any;
})();
</script>
</body>
</html>
